conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  linux_riscv64: default
  osx_arm64: default
test: native_and_emulated
conda_build:
  pkg_format: '2'
conda_install_tool: pixi
conda_build_tool: rattler-build
# GHC's interpreter (used for Template Haskell) loads C libraries from the
# sysroot into a process that runs against the image's glibc, so the image's
# glibc has to match c_stdlib_version (2.17 on linux-64, 2.28 on linux-aarch64).
os_version:
  linux_64: cos7
  linux_aarch64: alma8
