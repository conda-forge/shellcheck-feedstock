context:
  version: "0.11.0"
  # Has to match the GHC of the Stackage snapshot in stack.yaml. On Windows,
  # stack installs that GHC itself, see build.bat.
  ghc_version: "9.10.2"

package:
  name: shellcheck
  version: ${{ version }}

source:
  - if: not riscv64
    then:
      url: https://github.com/koalaman/shellcheck/archive/v${{ version }}.tar.gz
      sha256: 8b07554f92e4fbfc33f1539a1f475f21c6503ceae8f806efcc518b1f529f7102
    # There is no Haskell toolchain (ghc-bootstrap, stack) for linux-riscv64 on
    # conda-forge yet, so repackage the upstream release binary there.
    else:
      url: https://github.com/koalaman/shellcheck/releases/download/v${{ version }}/shellcheck-v${{ version }}.linux.riscv64.tar.xz
      sha256: 693c987777e7b524dd311d9b8c704885a39c889c9804bb1ef1fd29b48567b0b3

build:
  number: 3
  script:
    env:
      GHC_VERSION: ${{ ghc_version }}

requirements:
  build:
    - if: unix and not riscv64
      then:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ghc-bootstrap ==${{ ghc_version }}
    - if: not riscv64
      then: stack >=3.7
    - if: linux or win
      then: binutils
    # GHC links with `clang --target=<arch>-apple-darwin`, for which clang looks
    # up an unprefixed `ld` and would otherwise find the system linker.
    - if: osx
      then: ld64
    # For collect_licenses.sh
    - if: win
      then:
        - m2-bash
        - m2-coreutils
        - m2-findutils
  host:
    - if: unix and not riscv64
      then:
        - libffi
        - libiconv
    # GHC uses its native bignum backend on macOS
    - if: linux and not riscv64
      then: gmp

tests:
  - package_contents:
      bin:
        - shellcheck
  - files:
      recipe:
        - tests/
    script:
      - shellcheck --version
      - shellcheck --exclude=SC2086 tests/test.sh
      - if: unix
        then: (shellcheck --format=gcc tests/test.sh || true) | grep SC2086
        else: shellcheck --format=gcc tests/test.sh | findstr SC2086

about:
  homepage: https://github.com/koalaman/shellcheck
  license: GPL-3.0-only AND BSD-3-Clause AND BSD-2-Clause AND MIT AND ISC
  license_family: GPL
  license_file:
    - if: riscv64
      then: LICENSE.txt
      else:
        - LICENSE
        # Generated by build.sh, licenses of the statically linked Haskell libraries
        - THIRDPARTY_LICENSES/
  summary: ShellCheck, a static analysis tool for shell scripts

extra:
  recipe-maintainers:
    - dbast
    - pavelzw
